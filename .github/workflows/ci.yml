name: CI

# 不在 push 时自动跑：三个系统一起跑太占资源，需要时在 Actions 页面手动触发
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # 失败时整套再跑一次：Bun 1.3.9 偶尔自己崩溃（panic / segfault），单个测试的重试挡不住，
      # 另外也挡掉偶发的时序抖动。重跑也失败才算失败
      - name: bun test (retry once on failure)
        shell: bash
        run: bun test || { echo "::warning::bun test failed, retrying once"; bun test; }
      - run: bun run build
      # 发布产物在纯 Node 下能导入、能跑
      - run: bun run smoke:node
